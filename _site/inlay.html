<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inlay | Lemon Banjos</title>
  <meta name="description" content="Shop pearl inlay and completed inlaid fingerboards and pegheads from Lemon Banjos.">
  <link rel="canonical" href="https://www.lemonbanjos.com/inlay.html">
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
  <div id="header"></div>

  <section class="section">
    <div class="container narrow">
      <h1 class="section-title">Inlay</h1>
      <p class="section-tagline">Pearl inlay sets and completed inlaid fingerboards and pegheads.</p>
    </div>

    <div class="container">
      <div class="card-grid">
        <a class="card-link" href="pearlInlay.html">
          <article class="card">
            <img loading="lazy" src="assets/product_images/inlay/pearl/1.webp" alt="Pearl Inlay" class="card-img">
            <div class="card-body">
              <h3 class="card-title">Pearl Inlay</h3>
              <p>View Pearl Inlay →</p>
            </div>
          </article>
        </a>

        <a class="card-link" href="inlaidParts.html">
          <article class="card">
            <img loading="lazy" src="assets/product_images/inlay/parts/1.webp" alt="Inlaid Fingerboards and Pegheads" class="card-img">
            <div class="card-body">
              <h3 class="card-title">Inlaid Fingerboards &amp; Pegheads</h3>
              <p>View Inlaid Parts →</p>
            </div>
          </article>
        </a>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script>
    function initHeaderFooter() {
      return Promise.all([
        fetch('header.html').then(r => r.text()).then(h => document.getElementById('header').innerHTML = h),
        fetch('footer.html').then(r => r.text()).then(f => document.getElementById('footer').innerHTML = f)
      ]).then(() => {
        const toggle = document.getElementById('menu-toggle');
        const nav = document.getElementById('main-nav');
        if (toggle && nav) {
          toggle.addEventListener('click', () => {
            const isOpen = nav.classList.toggle('open');
            toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          });
        }
      });
    }
    initHeaderFooter().catch(console.error);
  </script>
</body>
</html>
