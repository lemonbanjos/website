<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading… | Lemon Banjos</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      emailjs.init({ publicKey: 'WYWVsQcBGt69SrK3u' });
    });
  </script>
</head>
<body>
  <div id="header"></div>

  <section class="product">
    <div class="container">
      <div class="product-grid">
        <div class="product-gallery">
          <div class="thumb-rail" role="list" id="thumbRail"></div>
          <div class="main-image-wrapper">
            <img alt="Product image" class="main-image" id="mainImage">
          </div>
        </div>

        <div class="product-info">
          <div class="product-header-block">
            <p id="seriesText">Lemon Banjos</p>
            <h1 class="product-title" id="productTitle">Loading…</h1>
          </div>

          <div class="product-price-block">
            <p id="productBasePrice" style="font-size:0.85rem;opacity:0.65;margin-bottom:-4px;"></p>
            <h2><em id="productPrice" aria-live="polite">Loading…</em></h2>
          </div>

          <div class="product-details">
            <div id="productOptions" aria-describedby="optionsHelp"></div>
            <p id="optionsHelp" class="small mt-neg-8">Choose configuration to see updated price.</p>
            <button class="button" id="askBtn" type="button">Ask About This Item</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="description-section" id="descriptionSection">
    <div class="container">
      <h2>Description</h2>
      <div class="product-description" id="productDescription"></div>
    </div>
  </section>

  <section class="specs-section" id="specsSection">
    <div class="container-wide">
      <div class="specs-header">
        <h2>Specifications</h2>
        <button id="printSpecsBtn" class="print-specs-btn" type="button" aria-label="Print specifications">🖨 Print Specs</button>
      </div>
      <div id="specsGrid" class="specs-grid" aria-live="polite"></div>
    </div>
  </section>

  <div id="footer"></div>

  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Image viewer">
    <span class="close" aria-label="Close">&times;</span>
    <span class="prev" aria-label="Previous">&#10094;</span>
    <img id="lightboxImg" alt="">
    <span class="next" aria-label="Next">&#10095;</span>
  </div>

  <div class="lb-modal-backdrop" id="emailModalBackdrop" aria-hidden="true">
    <div class="lb-modal" role="dialog" aria-modal="true" aria-labelledby="emailModalTitle">
      <h3 id="emailModalTitle">Tell me how to reach you</h3>
      <p class="lb-note">I’ll include your selected options and price automatically.</p>
      <form id="emailForm">
        <div class="lb-row"><div><label for="custName">Name</label><input id="custName" type="text" required></div><div><label for="custEmail">Email</label><input id="custEmail" type="email" required></div></div>
        <div class="lb-row"><div><label for="custPhone">Phone</label><input id="custPhone" type="tel"></div><div><label for="custAddress">Address</label><input id="custAddress" type="text"></div></div>
        <div class="lb-row"><div><label for="custCity">City</label><input id="custCity" type="text"></div><div><label for="custState">State</label><input id="custState" type="text"></div></div>
        <div class="lb-row"><div><label for="custZip">ZIP Code</label><input id="custZip" type="text"></div></div>
        <div class="lb-row comments-row"><div class="lb-comments-group"><label for="custComments">Comments</label><textarea id="custComments"></textarea></div></div>
        <div id="emailStatus" class="lb-note lb-hidden" aria-live="polite"></div>
        <div class="lb-actions"><button type="button" class="lb-btn" id="cancelEmail">Cancel</button><button type="submit" class="lb-btn primary">Send</button></div>
      </form>
    </div>
  </div>

  <script>
    const SHEET_ID = '1JaKOJLDKDgEvIg54UKKg2J3fftwOsZlKBw1j5qjeheU';
    const params = new URLSearchParams(window.location.search);
    const TYPE = (params.get('type') || 'pearl').toLowerCase();
    const KEY = (params.get('key') || '').trim();
    const CFG = TYPE === 'parts'
      ? { products:'Inlaid_Parts', options:'Inlaid_Parts_Options', specs:'Inlaid_Parts_Specs', folder:'parts', label:'Inlaid Parts' }
      : { products:'Pearl_Inlay', options:'Pearl_Inlay_Options', specs:'Pearl_Inlay_Specs', folder:'pearl', label:'Pearl Inlay' };

    const clean = v => (v == null ? '' : String(v).replace(/\u00a0/g,' ').trim());
    const fmtUSD = n => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);
    const rows = t => (t?.rows || []).map(r => (r.c || []).map(c => c?.v ?? null));
    const canon = s => clean(s).toLowerCase();
    const state = { product:null, options:{}, groupNames:{}, selected:{}, specs:{} };

    function gvizQuery(sheet,tq){return new Promise((resolve,reject)=>{const cb=`__gviz_${Date.now()}_${Math.floor(Math.random()*1e9)}`;const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?'+new URLSearchParams({sheet,tq,tqx:'responseHandler:'+cb}).toString();const s=document.createElement('script');s.src=url;s.async=true;const to=setTimeout(()=>{cleanup();reject(new Error('GViz timeout'));},15000);function cleanup(){clearTimeout(to);s.remove();try{delete window[cb]}catch(_){}}window[cb]=r=>{cleanup();r?.status==='error'?reject(new Error('GViz error')):resolve(r?.table)};s.onerror=()=>{cleanup();reject(new Error('Failed to load data'))};document.head.appendChild(s);});}
    function isTrue(v){return v==null||v===true||v===1||String(v).toLowerCase()==='true';}

    async function loadData(){
      if(!KEY) throw new Error('Missing product key');
      const [pt,ot,st]=await Promise.all([
        gvizQuery(CFG.products,`select A,B,C,D,E,F,G,H,I,K,L where A='${KEY.replace(/'/g,"''")}'`),
        gvizQuery(CFG.options,`select B,C,D,E,F,G,H,I,J where A='${KEY.replace(/'/g,"''")}'`),
        gvizQuery(CFG.specs,`select B,C,D,E where A='${KEY.replace(/'/g,"''")}' order by B asc, E asc`)
      ]);
      const p=rows(pt)[0]||[];
      const [key,title,series,base,sale,saleLabel,saleActive,imageCount,videoUrl,visible,description]=p;
      if(!key||!isTrue(visible)) throw new Error('Product unavailable');
      state.product={key:clean(key),title:clean(title),series:clean(series),base:Number(base||0),sale:Number(sale||0),saleLabel:clean(saleLabel),saleActive:isTrue(saleActive)&&Number(sale)>0,imageCount:Number(imageCount||1)||1,description:clean(description)};

      rows(ot).forEach(r=>{const[group,name,delta,type,isDefault,sort,visibleOpt,depGroup,depValue]=r;const g=canon(group);if(!g||!clean(name))return;if(!state.options[g])state.options[g]=[];state.groupNames[g]=clean(group);state.options[g].push({name:clean(name),delta:Number(delta||0),type:clean(type).toLowerCase()==='percent'?'percent':'flat',isDefault:isTrue(isDefault),visible:isTrue(visibleOpt),depGroup:canon(depGroup),depValue:clean(depValue),sort:Number(sort||0)});});
      Object.values(state.options).forEach(a=>a.sort((x,y)=>x.sort-y.sort));
      rows(st).forEach(r=>{const[section,label,value,sort]=r;const sec=clean(section);if(!sec||!clean(label)||!clean(value))return;(state.specs[sec]??=[]).push({label:clean(label),value:clean(value),sort:Number(sort||0)});});
      Object.values(state.specs).forEach(a=>a.sort((x,y)=>x.sort-y.sort));
    }

    function renderProduct(){
      const p=state.product;
      document.getElementById('seriesText').textContent=p.series||CFG.label;
      document.getElementById('productTitle').textContent=p.title||p.key;
      document.title=`${p.title||p.key} | Lemon Banjos`;
      document.getElementById('productDescription').textContent=p.description;
      document.getElementById('descriptionSection').style.display=p.description?'':'none';

      const slug=p.key.toLowerCase(); const base=`assets/product_images/inlay/${CFG.folder}/${slug}/`;
      const main=document.getElementById('mainImage'); main.src=base+'1.webp'; main.dataset.large=base+'1.webp'; main.alt=p.title;
      const rail=document.getElementById('thumbRail');
      rail.innerHTML='';
      for(let i=1;i<=p.imageCount;i++){const img=document.createElement('img');img.src=base+`thumbnails/${i}.webp`;img.dataset.large=base+`${i}.webp`;img.alt=`${p.title} image ${i}`;img.loading='lazy';img.addEventListener('click',()=>{main.src=img.dataset.large;main.dataset.large=img.dataset.large;});rail.appendChild(img);}
      renderOptions(); renderSpecs(); recalcPrice();
    }

    function renderOptions(){
      const c=document.getElementById('productOptions'); c.innerHTML='';
      Object.entries(state.options).forEach(([g,opts])=>{const block=document.createElement('div');block.className='option-block';block.dataset.groupCanon=g;const p=document.createElement('p');p.textContent=state.groupNames[g]||g;block.appendChild(p);const sel=document.createElement('select');sel.className='option-select';sel.dataset.groupCanon=g;opts.forEach(o=>{const op=document.createElement('option');op.value=o.name;let suffix='';if(o.delta){suffix=o.type==='percent'?` (${o.delta>0?'+':''}${o.delta}%)`:` (${o.delta>0?'+':'-'}${fmtUSD(Math.abs(o.delta))})`;}op.textContent=o.name+suffix;sel.appendChild(op);});const def=opts.find(o=>o.isDefault)||opts[0];if(def){state.selected[g]=def.name;sel.value=def.name;}sel.addEventListener('change',()=>{state.selected[g]=sel.value;updateVisibility();recalcPrice();});block.appendChild(sel);c.appendChild(block);});updateVisibility();
      if(!Object.keys(state.options).length) document.getElementById('optionsHelp').style.display='none';
    }

    function updateVisibility(){
      Object.entries(state.options).forEach(([g,opts])=>{const block=document.querySelector(`.option-block[data-group-canon="${g}"]`);const sel=block?.querySelector('select');if(!sel)return;let any=false;opts.forEach((o,i)=>{let show=o.visible;if(show&&o.depGroup&&o.depValue)show=clean(state.selected[o.depGroup]).toLowerCase()===clean(o.depValue).toLowerCase();sel.options[i].hidden=!show;if(show)any=true;});block.style.display=any?'':'none';const cur=state.selected[g];const vis=opts.filter((o,i)=>!sel.options[i].hidden);if(vis.length&&!vis.some(o=>o.name===cur)){const n=vis.find(o=>o.isDefault)||vis[0];state.selected[g]=n.name;sel.value=n.name;}});
    }

    function recalcPrice(){
      const p=state.product; let regular=p.base; let sale=p.saleActive?p.sale:0;
      Object.entries(state.options).forEach(([g,opts])=>{const o=opts.find(x=>x.name===state.selected[g]);if(!o)return;if(o.type==='percent'){regular+=p.base*(o.delta/100);if(p.saleActive)sale+=p.sale*(o.delta/100);}else{regular+=o.delta;if(p.saleActive)sale+=o.delta;}});
      const price=document.getElementById('productPrice');const baseEl=document.getElementById('productBasePrice');
      if(p.saleActive){baseEl.innerHTML=`<s>${fmtUSD(regular)}</s>${p.saleLabel?' — '+p.saleLabel:''}`;price.textContent=fmtUSD(sale);}else{baseEl.textContent='';price.textContent=fmtUSD(regular);}price.dataset.base=fmtUSD(p.base);
    }

    function renderSpecs(){const grid=document.getElementById('specsGrid');grid.innerHTML='';const sections=Object.entries(state.specs);if(!sections.length){document.getElementById('specsSection').style.display='none';return;}sections.forEach(([sec,items])=>{const card=document.createElement('div');card.className='spec-card';card.innerHTML=`<h3>${sec}</h3>`;items.forEach(x=>{const row=document.createElement('div');row.className='spec-row';row.innerHTML=`<span class="spec-label">${x.label}</span><span class="spec-value">${x.value}</span>`;card.appendChild(row);});grid.appendChild(card);});}

    function selectionsText(){return Object.entries(state.selected).map(([g,v])=>`${state.groupNames[g]||g}: ${v}`).join('\n');}

    function setupInquiry(){const btn=document.getElementById('askBtn'),back=document.getElementById('emailModalBackdrop'),cancel=document.getElementById('cancelEmail'),form=document.getElementById('emailForm'),status=document.getElementById('emailStatus');btn.addEventListener('click',()=>back.style.display='flex');cancel.addEventListener('click',()=>back.style.display='none');back.addEventListener('click',e=>{if(e.target===back)back.style.display='none'});form.addEventListener('submit',async e=>{e.preventDefault();status.classList.remove('lb-hidden');status.textContent='Sending…';try{await emailjs.send('service_wbxklc2','contact_us',{from_name:custName.value.trim(),from_email:custEmail.value.trim(),phone:custPhone.value.trim(),subject:`Inlay inquiry: ${state.product.title}`,message:[`TYPE: ${CFG.label} inquiry`,`ITEM: ${state.product.title}`,`KEY: ${state.product.key}`,`DISPLAYED PRICE: ${document.getElementById('productPrice').textContent}`,'','SELECTIONS:',selectionsText()||'(none)','','COMMENTS:',custComments.value.trim()||'(none)','','SHIPPING / LOCATION (optional):',`Address: ${custAddress.value.trim()}`,`City: ${custCity.value.trim()}`,`State: ${custState.value.trim()}`,`ZIP: ${custZip.value.trim()}`].join('\n'),reply_to:custEmail.value.trim(),page_url:window.location.href});status.textContent='Thanks! I’ve received your info and will be in touch soon.';setTimeout(()=>{form.reset();back.style.display='none';status.classList.add('lb-hidden');},2500);}catch(err){console.error(err);status.textContent='Sorry—could not send. Please try again.';}});}

    function setupLightbox(){const box=document.getElementById('lightbox'),img=document.getElementById('lightboxImg'),main=document.getElementById('mainImage');main.addEventListener('click',()=>{img.src=main.dataset.large||main.src;box.style.display='flex';});box.querySelector('.close').addEventListener('click',()=>box.style.display='none');box.addEventListener('click',e=>{if(e.target===box)box.style.display='none';});}

    function initHeaderFooter(){return Promise.all([fetch('header.html').then(r=>r.text()).then(h=>document.getElementById('header').innerHTML=h),fetch('footer.html').then(r=>r.text()).then(f=>document.getElementById('footer').innerHTML=f)]).then(()=>{const t=document.getElementById('menu-toggle'),n=document.getElementById('main-nav');if(t&&n)t.addEventListener('click',()=>{const o=n.classList.toggle('open');t.setAttribute('aria-expanded',o?'true':'false');});});}

    document.addEventListener('DOMContentLoaded',async()=>{try{await initHeaderFooter();await loadData();renderProduct();setupInquiry();setupLightbox();document.getElementById('printSpecsBtn').addEventListener('click',()=>window.print());}catch(err){console.error(err);document.getElementById('productTitle').textContent='Item unavailable';document.getElementById('productPrice').textContent='';document.getElementById('productOptions').innerHTML='';document.getElementById('descriptionSection').style.display='none';document.getElementById('specsSection').style.display='none';}});
  </script>
</body>
</html>
